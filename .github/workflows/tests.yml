name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q xbot xbot.py tests

      - name: Import bot package
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib
          import pkgutil
          import xbot.bot

          for _, name, _ in pkgutil.walk_packages(xbot.bot.__path__, "xbot.bot."):
              importlib.import_module(name)
          PY

      - name: Run unit tests with coverage gate
        run: |
          PYTHONPATH=. python -m coverage run \
            --source=xbot.bot.operation_details,xbot.bot.operation_logs,xbot.bot.formatters,xbot.bot.keyboards \
            -m unittest discover -q -s tests
          python -m coverage report \
            --include='xbot/bot/operation_details.py,xbot/bot/operation_logs.py,xbot/bot/formatters.py,xbot/bot/keyboards.py' \
            --fail-under=20
