name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q xbot xbot.py tests

      - name: Import bot package
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib
          import pkgutil
          import xbot.bot

          for _, name, _ in pkgutil.walk_packages(xbot.bot.__path__, "xbot.bot."):
              importlib.import_module(name)
          PY

      - name: Ruff lint
        run: python -m ruff check xbot tests

      - name: Ruff format check
        run: python -m ruff format --check xbot tests

      - name: Mypy type check
        run: python -m mypy xbot

      - name: Run unit tests with coverage gate
        run: |
          PYTHONPATH=. python -m coverage run \
            --source=xbot.bot.application,xbot.bot.router,xbot.bot.callback_data,xbot.bot.operation_details,xbot.bot.operation_logs,xbot.bot.formatters,xbot.bot.keyboards,xbot.bot.handlers.parameters,xbot.bot.handlers.text_input,xbot.node_monitor,xbot.db.cache._core \
            -m unittest discover -q -s tests
          python -m coverage report \
            --include='xbot/bot/application.py,xbot/bot/router.py,xbot/bot/callback_data.py,xbot/bot/operation_details.py,xbot/bot/operation_logs.py,xbot/bot/formatters.py,xbot/bot/keyboards.py,xbot/bot/handlers/parameters.py,xbot/bot/handlers/text_input.py,xbot/node_monitor.py,xbot/db/cache/_core.py' \
            --fail-under=35
