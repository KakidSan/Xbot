# Xbot Docker 配置模板
# 使用方式：cp config.docker.example.yaml config.yaml，然后按实际环境修改。
#
# 重要：为了便于在 systemd 直接部署与 Docker 部署之间切换，
# app.cache_path 请保持相对路径 data/xbot.sqlite3。

telegram:
  bot_token: "123456:replace_me"
  allowed_user_ids:
    - 123456789

redis:
  # 如果 Redis 在宿主机：
  # - Linux 可使用宿主机网关 IP，或在 compose 中额外配置 host 网络。
  # - 如果 Redis 是另一个 compose 服务，可填写服务名，例如 redis。
  host: "127.0.0.1"
  port: 6379
  password: null
  db: 0
  ssl: false
  prefix: ""

mysql:
  # 如果 MySQL 在宿主机，容器内的 127.0.0.1 指的是容器自己。
  # 请改成宿主机可访问 IP、数据库服务域名，或 compose 服务名。
  # 建议使用只有 SELECT 权限的只读账号。
  host: "127.0.0.1"
  port: 3306
  database: ""
  username: ""
  password: ""

app:
  config_watch_interval_seconds: 2
  cache_path: "data/xbot.sqlite3"
  collector_interval_seconds: 60
  traffic_dashboard_refresh_seconds: 60
  cache_retention_days: 7
  ip_geo_queries_per_minute: 30
