# Xboard Redis Telegram Bot 配置文件
# 修改本文件后，服务会自动检测并重新加载生效。

telegram:
  # Telegram BotFather 提供的 Bot Token
  bot_token: "123456:replace_me"

  # 允许使用 Bot 的 Telegram 用户 ID 白名单
  # 为空时拒绝所有用户，避免误开放。
  allowed_user_ids:
    - 123456789

redis:
  # 不填写时，Redis 连接测试会提示连接信息未输入完整。
  host: ""
  port: null
  password: null
  db: 0
  ssl: false

  # Bot IP 记录 Redis prefix，如没有就留空。
  prefix: ""

mysql:
  # 不填写时，MySQL 连接测试会提示连接信息未输入完整。
  # 建议使用只有 SELECT 权限的只读账号。
  host: ""
  port: null
  database: ""
  username: ""
  password: ""

app:
  # 配置文件热加载检测间隔，单位秒
  config_watch_interval_seconds: 2

  # 本地 SQLite 缓存文件。相对路径以 config.yaml 所在目录为基准。
  cache_path: "data/xbot.sqlite3"

  # 后台采集 Redis/MySQL 写入缓存的间隔，单位秒。
  collector_interval_seconds: 60

  # 已生成/置顶的流量面板自动刷新间隔，单位秒；最低 30 秒。
  traffic_dashboard_refresh_seconds: 60

  # 缓存保留天数。超过该时间的活跃 IP 记录会自动清理。
  cache_retention_days: 7

  # ip-api 免费端点限速保护：每分钟最多查询多少个未补全归属地的 IP。
  # ip-api 常见免费限制约 45 次/分钟，这里默认 30，实际按每 10 秒最多 5 个 IP 分批执行，留出余量。
  ip_geo_queries_per_minute: 30
